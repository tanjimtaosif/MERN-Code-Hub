<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
  <title>Deshi Deals | Home</title>
</head>

<body>
  <!-- Header Section -->
  <header class="shadow-lg py-3 bg-white relative z-10">

    <div class="flex justify-center items-center gap-1">
      <img src="/assets/logo.png" alt="" class="w-12">
      <div class="">
        <h2 class="  text-pink-500 text-xl">Deshi <span class="font-bold">Deals</span></h2>
        <p class="text-sm text-gray-500">Cheap Price, Best Quality</p>
      </div>
    </div>
  </header>
  <!-- Hero Section -->
  <div class="flex justify-center flex-col items-center 
            bg-gradient-to-b from-white via-white to-[#e4a5d3] -mb-20">
    <h1 class="text-[58px] font-bold text-center mt-[148px]">
      Purchase TK 200 or above & get <br>
      <span class="text-pink-500">20% off</span>
    </h1>
    <div class="flex justify-center items-center mt-[40px] gap-5">
      <h1 class="text-2xl">Use Promo Code</h1>
      <h1 class="text-center bg-pink-500 py-[18px] rounded-[8px] px-[46px] text-2xl text-white">
        SELL200
      </h1>
    </div>
    <img src="assets/hero-bg.png" alt="" class="-mb-30">
  </div>
</body>

</html>
