<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Image Examples</title>
</head>

<body>

    <h3>Will See Some Images</h3>
    <p>Below are images loaded from different sources:</p>

    <strong>1. Image from the same directory:</strong><br>
    <img src="running.jpg" alt="Running Image from same folder" width="300"><br><br>

    <strong>2. Image from a subfolder (e.g., images folder):</strong><br>
    <img src="Assets/cycling.jpg" alt="Nature Image from subfolder" width="300"><br><br>

    <strong>3. Image from an external hyperlink:</strong><br>
    <img src="https://images.unsplash.com/photo-1508780709619-79562169bc64" alt="External Image" width="300"><br><br>

</body>

</html>
