<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Information Collection</title>
</head>

<body>

    <h3>Information Collection</h3>
    <form>

        <!-- Basic Inputs -->
        <label>Text: <input type="text" placeholder="Enter text"></label><br><br>
        <label>Password: <input type="password" placeholder="Enter password"></label><br><br>
        <label>Email: <input type="email" placeholder="Enter email"></label><br><br>
        <label>Number: <input type="number" placeholder="Enter number"></label><br><br>
        <label>Search: <input type="search" placeholder="Search..."></label><br><br>
        <label>Tel: <input type="tel" placeholder="Enter phone"></label><br><br>
        <label>URL: <input type="url" placeholder="Enter website URL"></label><br><br>

        <!-- Selection Inputs -->
        <label>Checkbox: <input type="checkbox"> I agree</label><br><br>
        <label>Radio:
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
        </label><br><br>

        <!-- Date & Time Inputs -->
        <label>Date: <input type="date"></label><br><br>
        <label>Month: <input type="month"></label><br><br>
        <label>Week: <input type="week"></label><br><br>
        <label>Time: <input type="time"></label><br><br>
        <label>Date & Time: <input type="datetime-local"></label><br><br>

        <!-- Dropdown Selection -->
        <label>Select your country:
            <select>
                <option value="">-- Select --</option>
                <option value="bd">Bangladesh</option>
                <option value="us">United States</option>
                <option value="uk">United Kingdom</option>
            </select>
        </label><br><br>

        <!-- Range & Color -->
        <label>Range: <input type="range" min="0" max="100"></label><br><br>
        <label>Color: <input type="color"></label><br><br>

        <!-- File Upload -->
        <label>File: <input type="file"></label><br><br>

        <!-- Hidden & Submit -->
        <input type="hidden" value="secret">
        <input type="submit" value="Submit">

    </form>

</body>

</html>
