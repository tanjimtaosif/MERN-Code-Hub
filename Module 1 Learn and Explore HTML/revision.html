<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML Elements Example</title>
</head>

<body>

    <div>
        <h2>Text Formatting</h2>
        <p>This is a <strong>strong</strong> text.</p>
        <p>This is an <em>emphasized</em> text.</p>
        <p>This is <i>italic</i> text.</p>
        <p>This is <b>bold</b> text.</p>
        <p>Line one<br>Line two (after a line break).</p>
    </div>

    <div>
        <h2>Ordered List (OL)</h2>
        <ol>
            <li>First item</li>
            <li>Second item</li>
            <li>Third item</li>
        </ol>
    </div>

    <div>
        <h2>Unordered List (UL)</h2>
        <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Cherry</li>
        </ul>
    </div>

    <div>
        <h2>Button Example</h2>
        <button onclick="alert('Button clicked!')">Click Me</button>
    </div>

</body>

</html>
