<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Background Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="color-box">
    This box has a background color only.
  </div>

  <div class="image-box">
    <span class="box">This box uses</span> a background image with no repeat and covers the full box.
  </div>

  <div class="repeat-box">
    This box has a repeating background image.
  </div>

</body>
</html>
