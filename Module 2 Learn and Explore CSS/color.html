<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="color.css">

    <!-- Internal CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h3 {
            text-align: center;
        }

        li {
            font-size: 18px;
        }

        li:nth-child(2) {
            color: teal;
        }

        li:nth-child(3) {
            color: tomato;
        }
    </style>
</head>

<body>

    <!-- Inline CSS -->
    <h3 style="color: aquamarine;">Learning CSS</h3>
    <h3 style="background-color: aquamarine;">Hello! Let's Start</h3>

    <p>CSS Meaning: Cascading Style Sheet</p>

    <ul>
        <li style="color: blueviolet;">Inline</li> <!-- Inline CSS -->
        <li>Internal</li> <!-- Styled by internal CSS -->
        <li>External</li> <!-- Styled by internal CSS -->
    </ul>

</body>

</html>
